<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Folio — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcfcfd;
    --ink:#1c2340;
    --ink-soft:#6b7280;
    --line:#eceef3;

    --blue-1:#7FE3FB;   /* back folder — light cyan top */
    --blue-2:#1EA6E6;   /* back folder — deep sky blue bottom */
    --blue-tab:#5DD3F7;
    --glass-1: rgba(255,255,255,.34);
    --glass-2: rgba(120,215,255,.22);
    --glass-border: rgba(255,255,255,.65);
    --folder-shadow: rgba(8,88,148,.36);

    --c1:#FFDFC7; /* peach */
    --c1-deep:#F6B57E;
    --c2:#D7F1E4; /* mint */
    --c2-deep:#9BDFC0;
    --c3:#E7E1FF; /* lavender - center */
    --c3-deep:#B9A9FF;
    --c4:#FFD9E8; /* blush */
    --c4-deep:#F9A9C7;
    --c5:#D8ECFF; /* sky */
    --c5-deep:#9CC7FA;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- NAV ---------- */
  .top-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:1160px;
    margin:0 auto;
    padding:28px 40px 0;
  }
  .logo{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.2px;
    color:var(--ink);
  }
  .logo span{ color:var(--blue-2); }
  .nav-links{
    display:flex;
    align-items:center;
    gap:36px;
    list-style:none;
    margin:0; padding:0;
  }
  .nav-links a{
    text-decoration:none;
    color:var(--ink-soft);
    font-size:14.5px;
    font-weight:500;
    transition:color .2s ease;
  }
  .nav-links a:hover{ color:var(--ink); }
  .nav-cta{
    border:1.5px solid var(--ink);
    border-radius:999px;
    padding:8px 20px;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    text-decoration:none;
    transition: background .2s ease, color .2s ease, transform .2s ease;
  }
  .nav-cta:hover{ background:var(--ink); color:#fff; transform:translateY(-1px); }

  /* ---------- HERO ---------- */
  .hero{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:calc(100vh - 90px);
    padding:20px 20px 60px;
  }

  .folder-scene{
    position:relative;
    width:480px;
    height:540px;
    max-width:92vw;
    transform: translateY(22px);
  }

  /* group that breathes gently */
  .folder-assembly{
    position:absolute;
    inset:0;
    animation: breathe 4.5s ease-in-out infinite;
  }
  .folder-scene:hover .folder-assembly{
    animation-play-state: paused;
  }
  @keyframes breathe{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-7px); }
  }

  .folder-shadow{
    position:absolute;
    left:50%;
    bottom:38px;
    width:340px;
    height:52px;
    transform:translateX(-50%);
    background: radial-gradient(ellipse at center, var(--folder-shadow) 0%, rgba(41,58,120,.12) 55%, rgba(41,58,120,0) 78%);
    filter: blur(7px);
    animation: shadow-pulse 4.5s ease-in-out infinite;
    z-index:0;
  }
  @keyframes shadow-pulse{
    0%,100%{ transform:translateX(-50%) scale(1); opacity:1; }
    50%{ transform:translateX(-50%) scale(.92) translateY(3px); opacity:.72; }
  }

  /* ---------- FOLDER BACK (opaque) ---------- */
  .folder-back{
    position:absolute;
    left:50%;
    bottom:54px;
    transform:translateX(-50%) scale(1);
    width:348px;
    height:232px;
    border-radius:14px 24px 28px 28px;
    background: linear-gradient(155deg, var(--blue-1), var(--blue-2));
    box-shadow:
      0 30px 50px -18px var(--folder-shadow),
      inset 0 -14px 22px rgba(0,0,0,.10),
      inset 0 2px 0 rgba(255,255,255,.18);
    z-index:1;
    opacity:1;
    transition: transform .55s cubic-bezier(.2,1.1,.4,1), opacity .55s ease;
    transform-origin:50% 100%;
  }
  .folder-back::before{
    content:"";
    position:absolute;
    top:-22px;
    left:20px;
    width:136px;
    height:29px;
    background:linear-gradient(155deg, var(--blue-1), var(--blue-tab));
    border-radius:14px 18px 0 0;
  }
  .folder-scene:hover .folder-back{
    transform: translateX(-50%) scale(.91);
    opacity:.88;
  }

  /* ---------- CARDS ---------- */
  .card{
    position:absolute;
    left:50%;
    transform-origin:50% 100%;
    transition: transform .6s cubic-bezier(.2,1.15,.4,1), z-index 0s;
    z-index:2;
  }
  .folder-scene:hover .card{ z-index:6; }

  .card-inner{
    width:100%;
    height:100%;
    border-radius:18px;
    cursor:pointer;
    border:2.5px solid rgba(255,255,255,.85);
    box-shadow: 0 10px 20px rgba(20,60,110,.18);
    transition: transform .28s cubic-bezier(.2,1.2,.4,1), box-shadow .28s ease;
    position:relative;
    overflow:hidden;
  }
  .card-inner:active{ transform: scale(.97); }

  .folder-scene:hover .card-inner:hover{
    transform: translateY(-10px) scale(1.07);
    box-shadow: 0 22px 32px rgba(30,42,95,.30);
  }

  /* individual card geometry — closed (peek) + open (fan) states */
  .card-0{
    width:88px; height:88px; bottom:162px;
    transform: translate(calc(-50% - 58px), 0) rotate(-7deg);
  }
  .card-0 .card-inner{ background: linear-gradient(160deg, var(--c1), var(--c1-deep)); }
  .folder-scene:hover .card-0{ transform: translate(calc(-50% - 115px), -62px) rotate(-17deg); }

  .card-1{
    width:84px; height:134px; bottom:102px;
    transform: translate(calc(-50% - 26px), 0) rotate(-3deg);
  }
  .card-1 .card-inner{ background: linear-gradient(160deg, var(--c2), var(--c2-deep)); }
  .folder-scene:hover .card-1{ transform: translate(calc(-50% - 68px), -108px) rotate(-8deg); }

  .card-2{
    width:96px; height:158px; bottom:64px;
    transform: translate(-50%, 0) rotate(0deg);
  }
  .card-2 .card-inner{ background: linear-gradient(160deg, var(--c3), var(--c3-deep)); }
  .folder-scene:hover .card-2{ transform: translate(-50%, -150px) rotate(0deg); }

  .card-3{
    width:84px; height:134px; bottom:102px;
    transform: translate(calc(-50% + 26px), 0) rotate(3deg);
  }
  .card-3 .card-inner{ background: linear-gradient(160deg, var(--c4), var(--c4-deep)); }
  .folder-scene:hover .card-3{ transform: translate(calc(-50% + 68px), -108px) rotate(8deg); }

  .card-4{
    width:88px; height:88px; bottom:162px;
    transform: translate(calc(-50% + 58px), 0) rotate(7deg);
  }
  .card-4 .card-inner{ background: linear-gradient(160deg, var(--c5), var(--c5-deep)); }
  .folder-scene:hover .card-4{ transform: translate(calc(-50% + 115px), -62px) rotate(17deg); }

  /* ---------- FOLDER FRONT (frosted glass) ---------- */
  .folder-front{
    position:absolute;
    left:50%;
    bottom:54px;
    transform:translateX(-50%) scale(1);
    transform-origin:50% 100%;
    width:312px;
    height:156px;
    border-radius:3px 3px 22px 22px;
    background:
      linear-gradient(155deg, rgba(255,255,255,.24) 0%, rgba(255,255,255,.06) 40%, rgba(90,205,250,.18) 100%);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    border:1px solid rgba(255,255,255,.65);
    border-top:none;
    box-shadow:
      0 24px 40px -14px var(--folder-shadow),
      inset 0 1px 0 rgba(255,255,255,.6),
      inset 0 0 24px rgba(255,255,255,.10);
    overflow:hidden;
    z-index:4;
    transition: transform .55s cubic-bezier(.2,1.1,.4,1), opacity .55s ease;
    pointer-events:none;
  }
  .folder-front::after{
    content:"";
    position:absolute;
    top:0; left:-20%;
    width:55%;
    height:100%;
    background:linear-gradient(120deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 70%);
    transform:skewX(-14deg);
  }
  .folder-scene:hover .folder-front{
    transform: translateX(-50%) translateY(10px) scale(.88);
    opacity:.62;
  }

  /* ---------- STICKERS / LOGOS ON FOLDER ---------- */
  .sticker-girl{
    position:absolute;
    left:118px;
    bottom:64px;
    width:64px;
    height:auto;
    transform: rotate(-7deg);
    transform-origin:50% 100%;
    filter: drop-shadow(0 8px 12px rgba(20,40,90,.28));
    z-index:5;
    pointer-events:none;
    transition: transform .5s cubic-bezier(.2,1.1,.4,1);
  }
  .folder-scene:hover .sticker-girl{
    transform: rotate(-10deg) translateY(-4px);
  }

  .badge-logo{
    position:absolute;
    left:216px;
    bottom:68px;
    width:104px;
    height:auto;
    transform: rotate(6deg);
    transform-origin:50% 50%;
    filter: drop-shadow(0 8px 12px rgba(20,40,90,.25));
    z-index:5;
    pointer-events:none;
    transition: transform .5s cubic-bezier(.2,1.1,.4,1);
  }
  .folder-scene:hover .badge-logo{
    transform: rotate(4deg) translateY(-3px);
  }

  /* ---------- HINT ARROW ---------- */
  .hint-arrow{
    position:absolute;
    right:6px;
    top:52%;
    transform:translateY(-50%);
    width:34px;
    height:34px;
    z-index:5;
    animation: nudge 2.2s ease-in-out infinite;
    opacity:.55;
  }
  .folder-scene:hover .hint-arrow{ opacity:0; }
  @keyframes nudge{
    0%,100%{ transform:translateY(-50%) translateX(0); opacity:.35; }
    50%{ transform:translateY(-50%) translateX(8px); opacity:.75; }
  }

  @media (prefers-reduced-motion: reduce){
    .folder-assembly, .folder-shadow, .hint-arrow{ animation:none !important; }
    .card, .folder-front, .card-inner{ transition:none !important; }
  }

  @media (max-width: 560px){
    .top-nav{ padding:22px 20px 0; }
    .nav-links{ display:none; }
    .folder-scene{ transform: scale(.82); }
  }
</style>
</head>
