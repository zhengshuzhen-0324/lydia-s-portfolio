<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Social Media Landscape — Lydia's Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #1c2340;
    }

    /* =========================
       TOP NAVIGATION
    ========================= */

    .project-nav {
      width: 100%;
      padding: 32px 48px 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: #1c2340;
      text-decoration: none;

      font-size: 15px;
      font-weight: 500;

      transition: transform 0.2s ease,
                  opacity 0.2s ease;
    }

    .back-link:hover {
      transform: translateX(-3px);
      opacity: 0.7;
    }

    /* =========================
       IMAGE AREA
    ========================= */

    .project-page {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 50px 70px 80px;
    }

    .image-wrapper {
      width: min(1450px, 100%);

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .project-image {
      display: block;

      width: 100%;
      height: auto;

      max-height: calc(100vh - 160px);

      object-fit: contain;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .project-nav {
        padding: 22px 20px 0;
      }

      .project-page {
        padding: 35px 16px 50px;
      }

      .project-image {
        max-height: none;
      }

    }

  </style>
</head>

<body>

  <!-- Back to homepage -->

  <nav class="project-nav">

    <a
      class="back-link"
      href="../portfolio-folder.html"
    >
      ← Back to Portfolio
    </a>

  </nav>


  <!-- Project image -->

  <main class="project-page">

    <div class="image-wrapper">

      <img
        class="project-image"
        src="social-media-landscape.jpeg"
        alt="Social Media Landscape — Lydia's social media event and campaign portfolio"
      >

    </div>

  </main>

</body>
</html>
