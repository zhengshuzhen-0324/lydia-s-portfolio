<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>About Me — Lydia's Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #fcfcfd;
      color: #1c2340;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .top-nav {
      width: 100%;
      padding: 30px 32px 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      color: #1c2340;
      text-decoration: none;

      font-size: 16px;
      font-weight: 500;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .back-link:hover {
      transform: translateX(-3px);
      opacity: 0.65;
    }

    .about-page {
      width: 100%;
      padding: 50px 32px 80px;

      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .image-wrapper {
      width: 100%;
      max-width: 1500px;

      display: flex;
      justify-content: center;
    }

    .about-image {
      display: block;

      width: auto;
      max-width: 100%;
      height: auto;

      object-fit: contain;

      background: #ffffff;

      box-shadow:
        0 18px 45px rgba(28, 35, 64, 0.10);
    }

    @media (max-width: 768px) {

      .top-nav {
        padding: 22px 20px 0;
      }

      .back-link {
        font-size: 15px;
      }

      .about-page {
        padding: 40px 20px 60px;
      }

      .about-image {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>

<body>

  <nav class="top-nav">
    <a
      class="back-link"
      href="../portfolio-folder.html"
      aria-label="Back to Portfolio"
    >
      ← Back to Portfolio
    </a>
  </nav>

  <main class="about-page">

    <div class="image-wrapper">

      <img
        class="about-image"
        src="./lydia-about-me.jpeg"
        alt="Lydia — About Me"
      >

    </div>

  </main>

</body>
</html>
