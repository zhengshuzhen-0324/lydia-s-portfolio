<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Folio — Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#fcfcfd;
    --ink:#1c2340;
    --ink-soft:#6b7280;

    --blue-1:#7FE3FB;
    --blue-2:#1EA6E6;
    --blue-tab:#5DD3F7;

    --folder-shadow:rgba(8,88,148,.36);
  }

  *{
    box-sizing:border-box;
  }

  html,
  body{
    margin:0;
    padding:0;
  }

  body{
    background:var(--bg);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }


  /* ============================================================
     DESKTOP HEADER
     两句话上下排列，居中放在文件夹上方
     ============================================================ */

  .top-nav{
    width:100%;
    max-width:1160px;

    margin:0 auto;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:24px;

    padding:
      58px
      30px
      10px;

    text-align:center;
  }

  .nav-greeting{
    margin:0;

    font-family:'Quicksand', sans-serif;

    font-size:40px;
    font-weight:700;

    line-height:1.15;

    letter-spacing:.2px;

    color:var(--ink);

    white-space:nowrap;
  }

  .nav-greeting span{
    color:var(--blue-2);
  }

  .nav-vibes{
    margin:0;

    font-family:'Quicksand', sans-serif;

    font-size:30px;
    font-weight:600;

    line-height:1.2;

    letter-spacing:.1px;

    color:var(--ink-soft);

    white-space:nowrap;
  }


  /* ============================================================
     HERO
     ============================================================ */

  .hero{
    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    min-height:
      calc(100vh - 180px);

    padding:
      0
      20px
      34px;
  }

  .folder-scene{
    position:relative;

    width:480px;
    height:540px;

    max-width:92vw;

    transform:
      translateY(2px);
  }

  .folder-hint{
    margin:
      4px
      0
      0;

    font-family:'Quicksand', sans-serif;

    font-size:15px;
    font-weight:600;

    letter-spacing:.3px;

    color:#70788d;

    text-align:center;

    animation:
      hint-breathe
      2.4s
      ease-in-out
      infinite;
  }

  @keyframes hint-breathe{
    0%,100%{
      opacity:.55;
      transform:translateY(0);
    }

    50%{
      opacity:1;
      transform:translateY(-3px);
    }
  }


  /* ============================================================
     FOLDER ASSEMBLY
     ============================================================ */

  .folder-assembly{
    position:absolute;

    inset:0;

    animation:
      breathe
      4.5s
      ease-in-out
      infinite;
  }

  .folder-scene:hover .folder-assembly{
    animation-play-state:paused;
  }

  @keyframes breathe{
    0%,100%{
      transform:translateY(0px);
    }

    50%{
      transform:translateY(-7px);
    }
  }

  .folder-shadow{
    position:absolute;

    left:50%;
    bottom:38px;

    width:340px;
    height:52px;

    transform:
      translateX(-50%);

    background:
      radial-gradient(
        ellipse at center,
        var(--folder-shadow) 0%,
        rgba(41,58,120,.12) 55%,
        rgba(41,58,120,0) 78%
      );

    filter:blur(7px);

    animation:
      shadow-pulse
      4.5s
      ease-in-out
      infinite;

    z-index:0;
  }

  @keyframes shadow-pulse{
    0%,100%{
      transform:
        translateX(-50%)
        scale(1);

      opacity:1;
    }

    50%{
      transform:
        translateX(-50%)
        scale(.92)
        translateY(3px);

      opacity:.72;
    }
  }


  /* ============================================================
     FOLDER BACK
     ============================================================ */

  .folder-back{
    position:absolute;

    left:50%;
    bottom:54px;

    transform:
      translateX(-50%)
      scale(1);

    width:348px;
    height:232px;

    border-radius:
      14px
      24px
      28px
      28px;

    background:
      linear-gradient(
        155deg,
        var(--blue-1),
        var(--blue-2)
      );

    box-shadow:
      0 30px 50px -18px var(--folder-shadow),
      inset 0 -14px 22px rgba(0,0,0,.10),
      inset 0 2px 0 rgba(255,255,255,.18);

    z-index:1;

    opacity:1;

    transition:
      transform .55s cubic-bezier(.2,1.1,.4,1),
      opacity .55s ease;

    transform-origin:
      50%
      100%;
  }

  .folder-back::before{
    content:"";

    position:absolute;

    top:-22px;
    left:20px;

    width:136px;
    height:29px;

    background:
      linear-gradient(
        155deg,
        var(--blue-1),
        var(--blue-tab)
      );

    border-radius:
      14px
      18px
      0
      0;
  }

  .folder-scene:hover .folder-back{
    transform:
      translateX(-50%)
      scale(.91);

    opacity:.88;
  }


  /* ============================================================
     CARDS
     ============================================================ */

  .card{
    position:absolute;

    left:50%;

    transform-origin:
      50%
      100%;

    transition:
      transform .6s cubic-bezier(.2,1.15,.4,1),
      z-index 0s;

    z-index:2;
  }

  .folder-scene:hover .card{
    z-index:6;
  }

  .card:hover,
  .card:focus-within,
  .card.is-active{
    z-index:50 !important;
  }

  .card-inner{
    width:100%;
    height:100%;

    position:relative;

    border-radius:24px;

    cursor:pointer;

    border:
      2.5px solid
      rgba(255,255,255,.85);

    box-shadow:
      0 10px 20px
      rgba(20,60,110,.18);

    overflow:hidden;

    transition:
      transform .28s cubic-bezier(.2,1.2,.4,1),
      box-shadow .28s ease;
  }

  .card-inner:active{
    transform:
      scale(.97);
  }

  .folder-scene:hover .card-inner:hover{
    transform:
      translateY(-10px)
      scale(1.07);

    box-shadow:
      0 22px 32px
      rgba(30,42,95,.30);
  }


  /* ============================================================
     CARD 1 — SELF INTRO
     ============================================================ */

  .card-0{
    width:148px;
    height:148px;

    bottom:126px;

    transform:
      translate(
        calc(-50% - 54px),
        20px
      )
      rotate(-5deg);
  }

  .card-0 .card-inner{
    background:
      #FFD2C8
      url("assets/self-intro-card.png")
      center center / cover
      no-repeat;
  }


  /* ============================================================
     CARD 2 — SOCIAL MEDIA ROCKER
     ============================================================ */

  .card-1{
    width:148px;
    height:148px;

    bottom:128px;

    transform:
      translate(
        calc(-50% - 26px),
        14px
      )
      rotate(-2deg);
  }

  .card-1 .card-inner{
    background:
      #CFEFD8
      url("assets/social-media-rocker-card.png")
      center center / cover
      no-repeat;
  }


  /* ============================================================
     CARD 3 — CONTENT CREATOR
     ============================================================ */

  .card-2{
    width:148px;
    height:148px;

    bottom:132px;

    transform:
      translate(
        -50%,
        8px
      )
      rotate(1deg);
  }

  .card-2 .card-inner{
    background:
      #D8D0FF
      url("assets/content-creator-card.png")
      center center / cover
      no-repeat;
  }


  /* ============================================================
     CARD 4 — PARTNERSHIP BUILDER
     ============================================================ */

  .card-3{
    width:148px;
    height:148px;

    bottom:128px;

    transform:
      translate(
        calc(-50% + 28px),
        14px
      )
      rotate(3deg);
  }

  .card-3 .card-inner{
    background:
      #FFD2E1
      url("assets/partnership-builder-card.png")
      center center / cover
      no-repeat;
  }


  /* ============================================================
     CARD 5 — COMMUNITY MARKETING
     ============================================================ */

  .card-4{
    width:148px;
    height:148px;

    bottom:126px;

    transform:
      translate(
        calc(-50% + 56px),
        20px
      )
      rotate(6deg);
  }

  .card-4 .card-inner{
    background:
      #D7F58A
      url("assets/community-marketing-card.png")
      center center / cover
      no-repeat;
  }


  /* ============================================================
     DESKTOP CARD FAN
     ============================================================ */

  .folder-scene:hover .card-0{
    transform:
      translate(
        calc(-50% - 205px),
        -72px
      )
      rotate(-17deg);

    z-index:8;
  }

  .folder-scene:hover .card-1{
    transform:
      translate(
        calc(-50% - 103px),
        -138px
      )
      rotate(-8deg);

    z-index:6;
  }

  .folder-scene:hover .card-2{
    transform:
      translate(
        calc(-50% - 6px),
        -174px
      )
      rotate(1deg);

    z-index:7;
  }

  .folder-scene:hover .card-3{
    transform:
      translate(
        calc(-50% + 82px),
        -132px
      )
      rotate(9deg);

    z-index:9;
  }

  .folder-scene:hover .card-4{
    transform:
      translate(
        calc(-50% + 168px),
        -72px
      )
      rotate(16deg);

    z-index:10;
  }

  .folder-scene:hover .card:hover,
  .folder-scene:hover .card:focus-within,
  .folder-scene:hover .card.is-active{
    z-index:50 !important;
  }


  /* ============================================================
     FOLDER FRONT
     ============================================================ */

  .folder-front{
    position:absolute;

    left:50%;
    bottom:54px;

    transform:
      translateX(-50%)
      scale(1);

    transform-origin:
      50%
      100%;

    width:312px;
    height:156px;

    border-radius:
      3px
      3px
      22px
      22px;

    background:
      linear-gradient(
        155deg,
        rgba(255,255,255,.24) 0%,
        rgba(255,255,255,.06) 40%,
        rgba(90,205,250,.18) 100%
      );

    backdrop-filter:
      blur(16px)
      saturate(180%);

    -webkit-backdrop-filter:
      blur(16px)
      saturate(180%);

    border:
      1px solid
      rgba(255,255,255,.65);

    border-top:none;

    box-shadow:
      0 24px 40px -14px var(--folder-shadow),
      inset 0 1px 0 rgba(255,255,255,.6),
      inset 0 0 24px rgba(255,255,255,.10);

    overflow:hidden;

    z-index:4;

    transition:
      transform .55s cubic-bezier(.2,1.1,.4,1),
      opacity .55s ease;

    pointer-events:none;
  }

  .folder-front::after{
    content:"";

    position:absolute;

    top:0;
    left:-20%;

    width:55%;
    height:100%;

    background:
      linear-gradient(
        120deg,
        rgba(255,255,255,.35) 0%,
        rgba(255,255,255,0) 70%
      );

    transform:
      skewX(-14deg);
  }

  .folder-scene:hover .folder-front{
    transform:
      translateX(-50%)
      translateY(10px)
      scale(.88);

    opacity:.62;
  }


  /* ============================================================
     LYDIA'S PORTFOLIO LOGO
     ============================================================ */

  .badge-logo{
    position:absolute;

    left:50%;
    bottom:68px;

    width:245px;
    height:auto;

    transform:
      translateX(-50%)
      rotate(-4deg);

    transform-origin:
      50%
      50%;

    filter:
      drop-shadow(
        0 9px 0
        rgba(130,128,145,.30)
      );

    z-index:5;

    pointer-events:none;

    transition:
      transform .5s cubic-bezier(.2,1.1,.4,1);
  }

  .folder-scene:hover .badge-logo{
    transform:
      translateX(-50%)
      rotate(-2deg)
      translateY(-4px)
      scale(1.04);
  }


  /* ============================================================
     HINT ARROW
     ============================================================ */

  .hint-arrow{
    position:absolute;

    right:6px;
    top:52%;

    transform:
      translateY(-50%);

    width:34px;
    height:34px;

    z-index:5;

    animation:
      nudge
      2.2s
      ease-in-out
      infinite;

    opacity:.55;
  }

  .folder-scene:hover .hint-arrow{
    opacity:0;
  }

  @keyframes nudge{
    0%,100%{
      transform:
        translateY(-50%)
        translateX(0);

      opacity:.35;
    }

    50%{
      transform:
        translateY(-50%)
        translateX(8px);

      opacity:.75;
    }
  }


  /* ============================================================
     SMALL / MEDIUM LAPTOP
     依然上下居中，但防止文字过宽
     ============================================================ */

  @media (min-width:561px) and (max-width:900px){

    .top-nav{
      gap:18px;

      padding:
        44px
        20px
        8px;
    }

    .nav-greeting{
      font-size:30px;
    }

    .nav-vibes{
      font-size:22px;
    }

    .hero{
      min-height:
        calc(100vh - 150px);
    }
  }


  /* ============================================================
     REDUCED MOTION
     ============================================================ */

  @media (prefers-reduced-motion: reduce){

    .folder-assembly,
    .folder-shadow,
    .hint-arrow,
    .folder-hint{
      animation:none !important;
    }

    .card,
    .folder-front,
    .card-inner{
      transition:none !important;
    }
  }


  /* ============================================================
     MOBILE — 保持之前布局不变
     ============================================================ */

  @media (max-width:560px){

    body{
      min-height:100svh;
    }


    /* ---------- MOBILE HEADER ---------- */

    .top-nav{
      width:100%;

      display:flex;

      flex-direction:column;

      justify-content:center;
      align-items:center;

      gap:7px;

      padding:
        20px
        16px
        0;
    }

    .nav-greeting{
      position:static;

      transform:none;

      font-size:16px;

      white-space:normal;

      text-align:center;
    }

    .nav-vibes{
      font-size:13px;

      font-weight:600;

      white-space:normal;

      text-align:center;

      line-height:1.4;
    }


    /* ---------- MOBILE HERO ---------- */

    .hero{
      min-height:
        calc(100svh - 100px);

      padding:
        0
        0
        22px;

      overflow:hidden;

      justify-content:flex-start;
    }

    .folder-scene{
      width:480px;
      min-width:480px;
      max-width:none;

      height:540px;

      transform:
        translateY(-2px)
        scale(.72);

      transform-origin:
        top center;

      margin-bottom:-145px;
    }

    .folder-hint{
      margin:
        0
        16px;

      font-size:14px;

      line-height:1.5;
    }


    /* ---------- MOBILE MOTION ---------- */

    .folder-assembly{
      animation:none;
    }

    .folder-shadow{
      animation:none;
    }

    .hint-arrow{
      display:none;
    }


    /* ---------- MOBILE CARD FAN ---------- */

    .folder-scene .card-0,
    .folder-scene:hover .card-0{
      transform:
        translate(
          calc(-50% - 126px),
          -56px
        )
        rotate(-14deg);

      z-index:8;
    }

    .folder-scene .card-1,
    .folder-scene:hover .card-1{
      transform:
        translate(
          calc(-50% - 64px),
          -108px
        )
        rotate(-7deg);

      z-index:7;
    }

    .folder-scene .card-2,
    .folder-scene:hover .card-2{
      transform:
        translate(
          calc(-50% - 2px),
          -132px
        )
        rotate(1deg);

      z-index:8;
    }

    .folder-scene .card-3,
    .folder-scene:hover .card-3{
      transform:
        translate(
          calc(-50% + 60px),
          -104px
        )
        rotate(8deg);

      z-index:9;
    }

    .folder-scene .card-4,
    .folder-scene:hover .card-4{
      transform:
        translate(
          calc(-50% + 120px),
          -54px
        )
        rotate(14deg);

      z-index:10;
    }

    .folder-scene .card.is-active,
    .folder-scene:hover .card.is-active{
      z-index:50 !important;
    }


    /* ---------- MOBILE FOLDER ---------- */

    .folder-scene .folder-back,
    .folder-scene:hover .folder-back{
      transform:
        translateX(-50%)
        scale(.92);

      opacity:.9;
    }

    .folder-scene .folder-front,
    .folder-scene:hover .folder-front{
      transform:
        translateX(-50%)
        translateY(8px)
        scale(.9);

      opacity:.72;
    }

    .folder-scene .badge-logo,
    .folder-scene:hover .badge-logo{
      transform:
        translateX(-50%)
        rotate(-2deg)
        translateY(-3px)
        scale(1.02);
    }


    /* ---------- MOBILE TOUCH ---------- */

    .folder-scene .card-inner:hover{
      transform:none;
    }

    .folder-scene .card-inner:active{
      transform:
        translateY(-6px)
        scale(.96);

      box-shadow:
        0 16px 26px
        rgba(30,42,95,.26);
    }
  }


  /* ============================================================
     SMALLER PHONES
     ============================================================ */

  @media (max-width:400px){

    .top-nav{
      padding:
        17px
        14px
        0;
    }

    .nav-greeting{
      font-size:15px;
    }

    .nav-vibes{
      font-size:12.5px;
    }

    .folder-scene{
      transform:
        translateY(4px)
        scale(.67);

      margin-bottom:-175px;
    }

    .folder-hint{
      font-size:13.5px;
    }
  }


  /* ============================================================
     VERY SMALL PHONES
     ============================================================ */

  @media (max-width:350px){

    .nav-greeting{
      font-size:14px;
    }

    .nav-vibes{
      font-size:12px;
    }

    .folder-scene{
      transform:
        translateY(8px)
        scale(.61);

      margin-bottom:-205px;
    }

    .folder-hint{
      font-size:13px;
    }
  }

</style>
</head>

<body>


  <!-- =========================================================
       HEADER
       ========================================================= -->

  <nav class="top-nav">

    <p class="nav-greeting">
      Greeeeeeetings from Lydia<span>!</span> ✦
    </p>

    <p class="nav-vibes">
      Sending all the good vibes!🍀
    </p>

  </nav>


  <!-- =========================================================
       PORTFOLIO HERO
       ========================================================= -->

  <main class="hero">

    <div
      class="folder-scene"
      aria-label="悬停查看作品"
    >

      <div class="folder-shadow"></div>

      <div class="folder-assembly">

        <div class="folder-back"></div>


        <!-- CARD 1 — ABOUT ME -->

        <a
          class="card card-0"
          href="about-me/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="About Lydia"
        >
          <div class="card-inner"></div>
        </a>


        <!-- CARD 2 — SOCIAL MEDIA -->

        <a
          class="card card-1"
          href="project-2/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open project 2"
        >
          <div class="card-inner"></div>
        </a>


        <!-- CARD 3 — CONTENT CREATOR -->

        <a
          class="card card-2"
          href="project-3/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open project 3"
        >
          <div class="card-inner"></div>
        </a>


        <!-- CARD 4 — PARTNERSHIP -->

        <a
          class="card card-3"
          href="project-4/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open project 4"
        >
          <div class="card-inner"></div>
        </a>


        <!-- CARD 5 — COMMUNITY MARKETING -->

        <a
          class="card card-4"
          href="project-5/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open project 5"
        >
          <div class="card-inner"></div>
        </a>


        <div class="folder-front"></div>


        <!-- =====================================================
             LYDIA'S PORTFOLIO STICKER
             ===================================================== -->

        <svg
          class="badge-logo"
          viewBox="0 0 430 185"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Lydia's Portfolio sticker"
        >

          <defs>

            <pattern
              id="dots"
              width="8"
              height="8"
              patternUnits="userSpaceOnUse"
            >

              <rect
                width="8"
                height="8"
                fill="#FFFDFE"
              />

              <circle
                cx="2"
                cy="2"
                r="1.15"
                fill="#F3A7C4"
                opacity=".8"
              />

            </pattern>

          </defs>


          <!-- SHADOW -->

          <text
            x="215"
            y="82"
            text-anchor="middle"
            style="
              font-family:'Baloo 2','Arial Rounded MT Bold',sans-serif;
              font-weight:800;
              font-size:72px;
              letter-spacing:-2px
            "
            fill="#B9B8C1"
            stroke="#B9B8C1"
            stroke-width="18"
            stroke-linejoin="round"
          >
            Lydia's
          </text>


          <text
            x="215"
            y="148"
            text-anchor="middle"
            style="
              font-family:'Baloo 2','Arial Rounded MT Bold',sans-serif;
              font-weight:800;
              font-size:64px;
              letter-spacing:-2px
            "
            fill="#B9B8C1"
            stroke="#B9B8C1"
            stroke-width="18"
            stroke-linejoin="round"
          >
            Portfolio
          </text>


          <!-- OUTER PINK -->

          <text
            x="215"
            y="72"
            text-anchor="middle"
            style="
              font-family:'Baloo 2','Arial Rounded MT Bold',sans-serif;
              font-weight:800;
              font-size:72px;
              letter-spacing:-2px
            "
            fill="url(#dots)"
            stroke="#EC3D88"
            stroke-width="18"
            stroke-linejoin="round"
            paint-order="stroke fill"
          >
            Lydia's
          </text>


          <text
            x="215"
            y="138"

  <!-- =========================================================
       CARD INTERACTION
       ========================================================= -->

  <script>

    const cards =
      document.querySelectorAll('.card');


    cards.forEach(function(card){

      card.addEventListener(
        'pointerdown',
        function(){

          cards.forEach(function(otherCard){
            otherCard.classList.remove('is-active');
          });

          card.classList.add('is-active');

        }
      );


      card.addEventListener(
        'pointerenter',
        function(){

          if(
            window.matchMedia(
              '(hover: hover) and (pointer: fine)'
            ).matches
          ){

            cards.forEach(function(otherCard){
              otherCard.classList.remove('is-active');
            });

            card.classList.add('is-active');

          }

        }
      );


      card.addEventListener(
        'pointerleave',
        function(){

          if(
            window.matchMedia(
              '(hover: hover) and (pointer: fine)'
            ).matches
          ){

            card.classList.remove('is-active');

          }

        }
      );

    });


    document
      .querySelectorAll('.card-inner')
      .forEach(function(cardInner){

        cardInner.addEventListener(
          'click',
          function(){

            cardInner.style.transform =
              'translateY(-10px) scale(.95)';

            setTimeout(
              function(){

                cardInner.style.transform = '';

              },
              140
            );

          }
        );

      });

  </script>
