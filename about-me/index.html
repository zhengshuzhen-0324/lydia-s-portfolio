<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>About Lydia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      font-family: Arial, sans-serif;
    }

    .about-page {
      width: min(1500px, 100%);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .about-image {
      display: block;

      width: 100%;
      height: auto;

      max-height: calc(100vh - 48px);

      object-fit: contain;
    }

    @media (max-width: 700px) {

      body {
        padding: 10px;
      }

      .about-image {
        max-height: calc(100vh - 20px);
      }

    }
  </style>

</head>


<body>

  <main class="about-page">

    <img
      class="about-image"
      src="lydia-about-me.jpeg"
      alt="Lydia (Shu Zhen) — About Me and social media portfolio introduction"
    >

  </main>

</body>
</html>
